name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bunch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.15"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q --cov=bunch --cov-report=term
      - run: pip install pip-audit && pip-audit -r requirements.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.13"
      - run: pip install -r bunch/requirements-dev.txt
      - run: ruff check bunch clients
      - run: mypy bunch/bunch

  clients:
    # The clients are stdlib-only and run on other people's machines: make sure
    # they still parse on the Python versions people actually have. 3.9's last
    # build is only published for Ubuntu 24.04, so this job stays on that image.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile clients/*.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Validate compose file
        run: |
          cp .env.example .env
          sed -i 's/^BUNCH_ADMIN_TOKEN=$/BUNCH_ADMIN_TOKEN=ci/' .env
          cp litellm/config.example.yaml litellm/config.yaml
          docker compose config --quiet
      - name: Build bunch image
        run: docker build -t bunch:ci bunch
      - name: Smoke test container
        run: |
          docker run -d --name bunch -e BUNCH_ADMIN_TOKEN=ci -p 8700:8700 bunch:ci
          for i in $(seq 1 20); do curl -fs localhost:8700/healthz && break; sleep 1; done
          curl -fs localhost:8700/healthz
          docker exec bunch python -m bunch.cli add-agent ci-agent

  check-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Scan for private info (IPs, emails, keys, home paths)
        run: SKIP_LLM=1 bash scripts/check-public.sh --all

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
