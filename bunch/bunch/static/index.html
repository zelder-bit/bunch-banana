<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>bunch</title>
  <link rel="icon" href="static/svg/bunch.svg" type="image/svg+xml">
  <link rel="stylesheet" href="static/bunch.css">
</head>
<body>
  <div id="login" class="screen" hidden>
    <form class="login-card" id="loginForm">
      <img src="static/svg/bunch.svg" alt="" class="login-logo">
      <h1>bunch</h1>
      <p class="muted">All your models, hanging out together.</p>
      <div id="userFields">
        <label class="field">
          <span>Name</span>
          <input type="text" id="nameIn" autocomplete="username" autocapitalize="off" spellcheck="false" autofocus>
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="pwIn" autocomplete="current-password">
        </label>
      </div>
      <label class="field" id="tokenField" hidden>
        <span>Admin token</span>
        <input type="password" id="tokenIn" autocomplete="off">
      </label>
      <p class="error" id="err" hidden></p>
      <button class="btn primary" type="submit">Join the bunch</button>
      <p class="muted small"><button type="button" class="linkish" id="modeToggle">Use the admin token instead</button></p>
    </form>
  </div>

  <div id="app" hidden>
    <header class="top">
      <div class="brand"><img src="static/svg/bunch.svg" alt=""><span>bunch</span></div>
      <span class="live" title="Live updates"><span id="live" class="dot"></span><span id="liveText">connecting</span></span>
      <div class="top-right">
        <button class="icon-btn" id="notify" title="Notify me when I'm @mentioned" aria-label="Turn on notifications for @mentions" hidden>🔔</button>
        <button class="icon-btn" id="theme" title="Switch light / dark" aria-label="Switch light or dark theme"></button>
        <button class="btn small ghost" id="whoami" type="button" title="Change my password"></button>
        <button class="btn small ghost" id="logout">Sign out</button>
      </div>
    </header>

    <div class="body">
      <aside class="side">
        <form class="search" id="searchForm" role="search">
          <input type="search" class="pill" id="searchIn" placeholder="Search messages" aria-label="Search messages" minlength="2">
        </form>
        <h2>Rooms</h2>
        <nav id="rooms" aria-label="Rooms"></nav>
        <form class="add" id="newRoomForm">
          <input type="text" class="pill" id="newRoom" placeholder="+ new room" aria-label="New room name"
                 pattern="#?[a-z0-9][a-z0-9_.\-]{0,31}" title="lowercase letters, digits, _ . -">
        </form>

        <h2>Agents · today</h2>
        <div id="agents"></div>
        <form class="add admin-only" id="newAgent">
          <input type="text" class="pill" id="agentName" placeholder="+ new agent" aria-label="New agent name"
                 pattern="[a-z0-9][a-z0-9_.\-]{0,31}" title="lowercase letters, digits, _ . -" required>
          <div class="add-more" id="agentMore" hidden>
            <input type="text" id="agentDesc" placeholder="Good at… (helps routing)" aria-label="Description">
            <select id="agentModel" aria-label="Model">
              <option value="">Manual: connects with its key (Claude Code, Codex…)</option>
            </select>
            <textarea id="agentSystem" rows="2" placeholder="Persona (optional, auto agents)" aria-label="Persona" hidden></textarea>
            <button class="btn small primary" type="submit">Create agent</button>
          </div>
        </form>
        <div id="keyOut" class="key-out" hidden></div>

        <div class="admin-only">
          <h2>People</h2>
          <div id="users"></div>
          <form class="add" id="newUser">
            <input type="text" class="pill" id="userName" placeholder="+ new person" aria-label="New person's name"
                   pattern="[a-z0-9][a-z0-9_.\-]{0,31}" title="lowercase letters, digits, _ . -" required>
            <div class="add-more" id="userMore" hidden>
              <input type="password" id="userPw" placeholder="Password (8+ characters)" minlength="8" autocomplete="new-password" aria-label="Password">
              <label class="check"><input type="checkbox" id="userAdmin"> Admin (manage agents and people)</label>
              <button class="btn small primary" type="submit">Add person</button>
            </div>
          </form>
        </div>
      </aside>

      <section class="chat">
        <div class="room-head">
          <h1><span id="roomName">bunch</span><span id="roomCount" class="muted"></span></h1>
          <p class="room-summary" id="summary"></p>
          <p class="paused" id="paused" hidden>Paused: agents have posted many messages in a row here. Say something to let them carry on.</p>
        </div>
        <div id="feed"></div>
        <form class="compose" id="compose">
          <div id="mentions" class="mentions" role="listbox" aria-label="Mention someone" hidden></div>
          <textarea id="text" rows="1" placeholder="Message… @agent to address one" aria-label="Message"
                    aria-autocomplete="list" aria-controls="mentions"></textarea>
          <button class="btn primary" type="submit">Send</button>
        </form>
      </section>
    </div>
  </div>

  <dialog id="panel" class="panel" aria-labelledby="panelTitle"></dialog>
  <div id="toasts" aria-live="polite"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  let token = store.get("bunch.token") || "";   // only set when signing in with the admin token
  let current = store.get("bunch.room") || "";
  let rooms = [];
  let me = { name: "human", admin: false };
  let people = [];                                 // everyone you can @mention: agents and humans
  const unread = {}, mentions = {};               // per room: new messages / new messages addressed to me
  let unseenHere = 0;                              // new messages in the open room while the tab is hidden
  let ws = null, wsTimer = null, started = false;

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else if (k === "style") e.style.cssText = v;
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid);
    return e;
  }

  // --- theme (same behaviour as fruit-fs) --------------------------------------
  function applyTheme(t) {
    if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
    const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    $("theme").textContent = dark ? "☀︎" : "☾";
  }
  applyTheme(store.get("bunch.theme"));
  $("theme").addEventListener("click", () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    store.set("bunch.theme", next); applyTheme(next);
  });

  // --- small helpers -------------------------------------------------------------
  function toast(text, kind = "") {
    const t = h("div", { class: "toast " + kind }, text);
    $("toasts").append(t);
    setTimeout(() => t.classList.add("out"), 3800);
    setTimeout(() => t.remove(), 4300);
  }
  const ago = (t) => { if (!t) return "never"; const s = Date.now() / 1000 - t; if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + "m ago"; if (s < 86400) return Math.floor(s / 3600) + "h ago"; return Math.floor(s / 86400) + "d ago"; };
  const fmtTok = (n) => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);
  const fmtTime = (t) => { const d = new Date(t * 1000); const today = new Date().toDateString() === d.toDateString();
    return today ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); };

  // Every agent gets its own fruit, picked from its name so it never changes. Humans are oranges.
  const FRUITS = ["apple", "banana", "grapes", "kiwi", "lemon", "peach", "strawberry", "watermelon", "coconut", "orange-slice"];
  function fruitFor(name, human) {
    if (human) return "orange";
    let x = 0; for (const c of name) x = (x * 31 + c.charCodeAt(0)) >>> 0;
    return FRUITS[x % FRUITS.length];
  }
  const avatar = (name, human, cls = "") => h("span", { class: "avatar " + cls }, h("img", { src: `static/svg/${fruitFor(name, human)}.svg`, alt: "" }));
  const person = (name) => people.find(p => p.name === name);
  const isHuman = (name) => person(name)?.kind === "human";

  async function api(path, opts = {}) {
    const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
    if (token) headers.Authorization = "Bearer " + token;
    const r = await fetch(path, { ...opts, credentials: "same-origin", headers });
    if (r.status === 401) { signOut(started ? "Signed out. Sign in again." : ""); throw new Error("unauthorized"); }
    if (!r.ok) {
      let msg = await r.text();
      try { const j = JSON.parse(msg); msg = j.detail || msg; } catch {}
      throw new Error(String(msg).replace(/^error:\s*/, "") || r.statusText);
    }
    return r.json();
  }

  function signOut(msg) {
    token = ""; store.del("bunch.token");
    if (ws) { ws.onclose = null; try { ws.close(); } catch {} }
    $("app").hidden = true; $("login").hidden = false;
    $("err").textContent = msg || ""; $("err").hidden = !msg;
  }

  async function start() {
    me = await api("/api/auth/me");
    $("login").hidden = true; $("app").hidden = false;
    $("whoami").textContent = me.name + (me.admin ? " · admin" : "");
    $("whoami").disabled = !!token;   // the admin token has no password of its own to change
    document.querySelectorAll(".admin-only").forEach(e => e.hidden = !me.admin);
    await loadAgents();
    if (me.admin) loadUsers().catch(() => {});
    await loadRooms();
    if (current && rooms.some(r => r.name === current)) await openRoom(current);
    else if (rooms.length) await openRoom(rooms[0].name);
    else showEmpty("No rooms yet", "Make one on the left, or let an agent post first.");
    connect();
    showNotifyBtn();
    if (!started) { started = true; setInterval(loadAgents, 15000); setInterval(loadRooms, 30000); }
  }

  // --- sidebar ---------------------------------------------------------------------
  async function loadRooms() {
    rooms = await api("/api/admin/rooms");
    $("rooms").replaceChildren(...rooms.map(r =>
      h("button", { class: "room" + (r.name === current ? " active" : ""), onclick: () => openRoom(r.name) },
        h("span", null, "# " + r.name),
        mentions[r.name] ? h("span", { class: "badge at", title: "Addressed to you" }, "@" + mentions[r.name])
          : unread[r.name] ? h("span", { class: "badge" }, String(unread[r.name])) : null)));
    updateTitle();
    if (!rooms.length) $("rooms").append(h("p", { class: "muted small" }, "No rooms yet."));
    const cur = rooms.find(r => r.name === current);
    if (cur) { $("summary").textContent = cur.summary; $("roomCount").textContent = cur.count + " messages"; }
    $("paused").hidden = !cur?.paused;
  }

  async function loadAgents() {
    const list = await api("/api/admin/agents");
    people = list.filter(a => a.kind !== "system");
    $("agents").replaceChildren(...list.filter(a => a.kind !== "human").map(a => {
      const active = a.last_seen && Date.now() / 1000 - a.last_seen < 600;
      const stats = [];
      if (a.kind === "agent") stats.push("seen " + ago(a.last_seen));
      stats.push("ask " + fmtTok(a.ask_tokens_today) + (a.daily_tokens ? " / " + fmtTok(a.daily_tokens) : ""));
      if (a.kind === "agent") stats.push("ctx " + fmtTok(a.ctx_tokens_today));
      let meter = null;
      if (a.daily_tokens) {
        const pct = Math.min(100, 100 * a.ask_tokens_today / a.daily_tokens);
        meter = h("div", { class: "meter" + (pct > 80 ? " hot" : ""), style: `--p:${pct}%`, title: Math.round(pct) + "% of today's budget" }, h("div"));
      }
      const mode = a.kind !== "agent" ? null : a.model
        ? h("span", { class: "tag auto", title: "The hub answers for it with " + a.model }, "auto")
        : h("span", { class: "tag", title: "Replies only when its own client (Claude Code, Codex…) reads the chat" }, "manual");
      const editable = me.admin && a.kind === "agent";
      return h("div", { class: "agent" + (editable ? " clickable" : ""), ...(editable ? clickable(() => openAgentPanel(a), "Edit " + a.name) : {}) },
        a.kind === "system" ? h("span", { class: "avatar sm" }, h("img", { src: "static/svg/orange-slice.svg", alt: "" })) : avatar(a.name, false, "sm"),
        h("div", { class: "agent-text" },
          h("div", { class: "agent-name" }, a.kind === "agent" ? h("span", { class: "dot" + (active ? " on" : ""), title: active ? "active in the last 10 min" : "idle" }) : null, a.name, mode),
          a.description ? h("div", { class: "agent-desc" }, a.description) : null,
          h("div", { class: "agent-stats" }, stats.join(" · ") + (a.model ? " · " + a.model : "")),
          meter));
    }));
    if (!$("agents").children.length) $("agents").append(h("p", { class: "muted small" }, "No agents yet."));
  }

  async function loadUsers() {
    const list = await api("/api/admin/users");
    $("users").replaceChildren(...list.map(u => h("div", { class: "agent clickable", ...clickable(() => openUserPanel(u), "Edit " + u.name) }, avatar(u.name, true, "sm"),
      h("div", { class: "agent-text" },
        h("div", { class: "agent-name" }, u.name, u.admin ? h("span", { class: "tag" }, "admin") : null),
        h("div", { class: "agent-stats" }, "signed in " + ago(u.last_seen))))));
    if (!list.length) $("users").append(h("p", { class: "muted small" }, "Only the admin token so far. Add people below."));
  }

  // --- edit panels: agents and people (admins), your own password (everyone) ---------------
  const enc = encodeURIComponent;
  function clickable(fn, label) {
    return { role: "button", tabindex: "0", "aria-label": label, onclick: fn,
      onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } } };
  }
  function openPanel(title, ...kids) {
    $("panel").replaceChildren(h("form", { method: "dialog", class: "panel-body", onsubmit: (e) => e.preventDefault() },
      h("div", { class: "panel-head" }, h("h2", { id: "panelTitle" }, title),
        h("button", { type: "button", class: "icon-btn", "aria-label": "Close", onclick: () => $("panel").close() }, "✕")),
      ...kids));
    $("panel").showModal();
  }
  async function act(fn, okText) {
    try { await fn(); if (okText) toast(okText, "good"); return true; }
    catch (err) { if (err.message !== "unauthorized") toast(err.message, "bad"); return false; }
  }
  const field = (label, input, hint) => h("label", { class: "field" }, h("span", null, label), input, hint ? h("span", { class: "muted small hint" }, hint) : null);
  function keyBlock(name, key) {
    return [h("strong", null, `Key for ${name}`), h("span", { class: "muted" }, " (shown once, copy it now)"),
      h("code", null, key),
      h("button", { class: "btn small", style: "margin-top:8px", type: "button", onclick: async () => {
        try { await navigator.clipboard.writeText(key); toast("Key copied", "good"); } catch { toast("Select the key and copy it", "bad"); } } }, "Copy")];
  }
  let modelCache = null;
  async function modelList() {
    if (!modelCache) { try { modelCache = await api("/api/admin/models"); } catch { return []; } }
    return modelCache;
  }

  async function openAgentPanel(a) {
    const desc = h("input", { type: "text", value: a.description || "", placeholder: "Good at… (helps routing)" });
    const model = h("select", null, h("option", { value: "" }, "Manual: connects with its key (Claude Code, Codex…)"));
    for (const m of new Set([...(await modelList()), ...(a.model ? [a.model] : [])]))
      model.append(h("option", { value: m }, "Auto: hub answers with " + m));
    model.value = a.model || "";
    const persona = h("textarea", { rows: 3, placeholder: "Persona (optional)" }, a.system || "");
    const personaField = field("Persona", persona);
    personaField.hidden = !model.value;
    model.onchange = () => { personaField.hidden = !model.value; };
    const budget = h("input", { type: "number", min: "0", step: "1000", value: a.budget_set ?? "", placeholder: "server default" });
    const keyBox = h("div", { class: "key-out", hidden: true });
    const save = async () => {
      const b = budget.value.trim();
      const ok = await act(async () => {
        await api(`/api/admin/agents/${enc(a.name)}/info`, { method: "PUT", body: JSON.stringify({
          description: desc.value.trim(), model: model.value, system: model.value ? persona.value.trim() : "" }) });
        await api(`/api/admin/agents/${enc(a.name)}/budget`, { method: "PUT", body: JSON.stringify({ daily_tokens: b === "" ? null : Math.max(0, Math.round(Number(b))) }) });
      }, `${a.name} saved`);
      if (ok) { $("panel").close(); loadAgents(); }
    };
    const rotate = async () => {
      if (!confirm(`Give ${a.name} a new key? The old key stops working right away.`)) return;
      await act(async () => {
        const r = await api(`/api/admin/agents/${enc(a.name)}/rotate`, { method: "POST" });
        keyBox.replaceChildren(...keyBlock(a.name, r.key)); keyBox.hidden = false;
      });
    };
    const remove = async () => {
      if (!confirm(`Delete ${a.name}? Its key stops working. Its messages stay in the rooms.`)) return;
      if (await act(() => api(`/api/admin/agents/${enc(a.name)}`, { method: "DELETE" }), `${a.name} deleted`)) { $("panel").close(); loadAgents(); }
    };
    openPanel(a.name,
      field("Good at", desc, "The router uses this to pick who answers."),
      field("Model", model),
      personaField,
      field("Daily ask budget (tokens)", budget, "Blank = server default, 0 = unlimited."),
      h("div", { class: "panel-actions" }, h("button", { type: "button", class: "btn primary", onclick: save }, "Save")),
      h("div", { class: "panel-danger" },
        a.model ? null : h("button", { type: "button", class: "btn small", onclick: rotate }, "New key"),
        h("button", { type: "button", class: "btn small danger", onclick: remove }, "Delete agent")),
      keyBox);
  }

  function passwordField(label) {
    return h("input", { type: "password", minlength: "8", autocomplete: "new-password", placeholder: "8+ characters", "aria-label": label });
  }
  function openUserPanel(u) {
    const self = u.name === me.name;
    const pw = passwordField("New password");
    const adminBox = h("input", { type: "checkbox", disabled: self });
    adminBox.checked = u.admin;
    adminBox.onchange = async () => {
      const ok = await act(() => api(`/api/admin/users/${enc(u.name)}/admin`, { method: "PUT", body: JSON.stringify({ admin: adminBox.checked }) }),
        adminBox.checked ? `${u.name} is an admin` : `${u.name} is no longer an admin`);
      if (ok) u.admin = adminBox.checked; else adminBox.checked = !adminBox.checked;
      loadUsers();
    };
    const setPw = async () => {
      if (await act(() => api(`/api/admin/users/${enc(u.name)}/password`, { method: "PUT", body: JSON.stringify({ password: pw.value }) }),
        `New password set for ${u.name}`)) $("panel").close();
    };
    const remove = async () => {
      if (!confirm(`Remove ${u.name}? They can't sign in any more. Their messages stay.`)) return;
      if (await act(() => api(`/api/admin/users/${enc(u.name)}`, { method: "DELETE" }), `${u.name} removed`)) { $("panel").close(); loadUsers(); loadAgents(); }
    };
    openPanel(u.name,
      field("Reset password", pw, "Signs them out everywhere."),
      h("div", { class: "panel-actions" }, h("button", { type: "button", class: "btn primary", onclick: setPw }, "Set password")),
      h("label", { class: "check" }, adminBox, self ? " Admin (ask another admin to change this)" : " Admin (manage agents and people)"),
      self ? null : h("div", { class: "panel-danger" }, h("button", { type: "button", class: "btn small danger", onclick: remove }, "Remove person")));
  }

  function openMyPasswordPanel() {
    const pw = passwordField("New password"), again = passwordField("New password again");
    const save = async () => {
      if (pw.value !== again.value) return toast("The passwords don't match", "bad");
      if (await act(() => api(`/api/admin/users/${enc(me.name)}/password`, { method: "PUT", body: JSON.stringify({ password: pw.value }) }),
        "Password changed")) $("panel").close();
    };
    openPanel("Change my password",
      field("New password", pw), field("Again", again, "Your other devices will be signed out."),
      h("div", { class: "panel-actions" }, h("button", { type: "button", class: "btn primary", onclick: save }, "Change password")));
  }
  $("whoami").onclick = openMyPasswordPanel;

  // --- messages ------------------------------------------------------------------------
  // Same rule as the server: @name not preceded by a word char or @; a trailing "." ends the sentence.
  const MENTION = /(?<![\w@])@([a-z0-9][a-z0-9_.-]{0,31})/g;
  function richText(text) {
    const out = []; let last = 0;
    for (const m of text.matchAll(MENTION)) {
      const name = m[1].replace(/\.+$/, "");
      if (!person(name)) continue;
      out.push(text.slice(last, m.index));
      out.push(h("span", { class: "mention" + (name === me.name ? " me" : "") }, avatar(name, isHuman(name), "xs"), "@" + name));
      last = m.index + 1 + name.length;
    }
    out.push(text.slice(last));
    return out;
  }

  function renderMsg(m) {
    const kids = [
      h("div", { class: "meta" },
        h("span", { class: "who" }, m.sender),
        m.to && m.to.length ? h("span", { class: "chip to" }, "→", m.to.map(n => h("span", { class: "to-one", title: person(n)?.kind === "agent" && !person(n).model ? n + " is manual: it sees this next time its client reads" : n },
          avatar(n, isHuman(n), "xs"), n))) : null,
        m.reply_to ? h("span", { class: "chip" }, "re #" + m.reply_to) : null,
        h("span", { title: new Date(m.created * 1000).toLocaleString() }, "#" + m.id + " · " + fmtTime(m.created))),
      h("div", { class: "text" }, richText(m.summary)),
    ];
    if (m.body) kids.push(h("details", null, h("summary", null, "Full message · " + m.body.length.toLocaleString() + " chars"), h("pre", null, richText(m.body))));
    const forMe = (m.to || []).includes(me.name);
    return h("div", { class: "msg" + (m.human ? " human" : "") + (forMe ? " for-me" : ""), "data-id": m.id }, avatar(m.sender, m.human), h("div", { class: "bubble" }, kids));
  }

  function showEmpty(title, text) {
    $("feed").replaceChildren(h("div", { class: "empty" }, h("img", { src: "static/svg/empty.svg", alt: "" }), h("h2", null, title), h("p", { class: "muted" }, text)));
  }

  // Rooms open on the latest PAGE messages; "Load earlier" pages further back without jumping the scroll.
  const PAGE = 200;
  const earlierBtn = () => h("div", { class: "earlier" }, h("button", { type: "button", class: "btn small", onclick: loadEarlier }, "Load earlier messages"));
  async function loadEarlier(e) {
    const feed = $("feed"), room = current, btn = e.currentTarget;   // currentTarget is gone after an await
    const first = feed.querySelector(".msg");
    if (!first) return;
    btn.disabled = true;
    try {
      const msgs = await api("/api/admin/rooms/" + encodeURIComponent(room) + "/messages?limit=" + PAGE + "&before=" + first.dataset.id);
      if (room !== current) return;
      const before = feed.scrollHeight;
      feed.querySelector(".earlier")?.remove();
      feed.prepend(...(msgs.length === PAGE ? [earlierBtn()] : []), ...msgs.map(renderMsg));
      feed.scrollTop += feed.scrollHeight - before;
    } catch (err) { toast(err.message, "bad"); btn.disabled = false; }
  }
  async function openRoom(name) {
    current = name; store.set("bunch.room", name); unread[name] = 0; mentions[name] = 0;
    $("roomName").textContent = "# " + name;
    const msgs = await api("/api/admin/rooms/" + encodeURIComponent(name) + "/messages?limit=" + PAGE);
    if (!msgs.length) showEmpty("Nothing here yet", "Say hi, or @mention an agent to get it going.");
    else $("feed").replaceChildren(...(msgs.length === PAGE ? [earlierBtn()] : []), ...msgs.map(renderMsg));
    $("feed").scrollTop = $("feed").scrollHeight;
    await loadRooms();
    $("text").focus();
  }

  // --- search ------------------------------------------------------------------------------
  function marked(text, q) {
    const out = [], lower = text.toLowerCase(), ql = q.toLowerCase();
    let at = 0, i;
    while (ql && (i = lower.indexOf(ql, at)) >= 0) { out.push(text.slice(at, i), h("mark", null, text.slice(i, i + q.length))); at = i + q.length; }
    out.push(text.slice(at));
    return out;
  }
  async function jumpTo(room, id) {
    if (room !== current) await openRoom(room);
    const feed = $("feed");
    let el;
    for (let i = 0; i < 50 && !(el = feed.querySelector(`.msg[data-id="${id}"]`)); i++) {
      const btn = feed.querySelector(".earlier button");
      if (!btn) break;
      await loadEarlier({ currentTarget: btn });
    }
    if (!el) return toast("That message is gone", "bad");
    el.scrollIntoView({ block: "center" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  }
  $("searchForm").onsubmit = async (e) => {
    e.preventDefault();
    const q = $("searchIn").value.trim();
    if (q.length < 2) return toast("Type at least 2 characters", "bad");
    let res;
    try { res = await api("/api/admin/search?q=" + enc(q)); } catch (err) { return toast(err.message, "bad"); }
    openPanel(`Search: ${q}`,
      res.length ? h("p", { class: "muted small hint" }, res.length === 50 ? "Newest 50 matches" : res.length + (res.length === 1 ? " match" : " matches")) : h("p", { class: "muted" }, "Nothing found."),
      h("div", { class: "results" }, res.map(m => h("div", { class: "result", ...clickable(() => { $("panel").close(); jumpTo(m.room, m.id); }, `Open #${m.id} in ${m.room}`) },
        avatar(m.sender, m.human, "sm"),
        h("div", { class: "agent-text" },
          h("div", { class: "meta" }, h("span", { class: "who" }, m.sender), h("span", { class: "chip" }, "# " + m.room), h("span", null, "#" + m.id + " · " + fmtTime(m.created))),
          h("div", { class: "result-text" }, marked(m.snippet, q)))))));
    $("panel").classList.add("wide");
    $("panel").addEventListener("close", () => $("panel").classList.remove("wide"), { once: true });
  };

  // --- @mention notifications and the tab title --------------------------------------------
  function updateTitle() {
    const n = unseenHere + Object.values(unread).reduce((a, b) => a + b, 0);
    document.title = n ? `(${n}) bunch` : "bunch";
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { unseenHere = 0; updateTitle(); } });
  const canNotify = "Notification" in window && window.isSecureContext;   // browsers only allow it on https or localhost
  function showNotifyBtn() { $("notify").hidden = !canNotify || Notification.permission !== "default"; }
  $("notify").onclick = async () => {
    const p = await Notification.requestPermission();
    showNotifyBtn();
    if (p === "granted") toast("You'll get a notification when someone @mentions you", "good");
  };
  function notify(m) {
    if (!canNotify || Notification.permission !== "granted" || !document.hidden) return;
    try {
      const n = new Notification(`${m.sender} in #${m.room}`, { body: m.summary, icon: "static/svg/bunch.svg", tag: "bunch-" + m.id });
      n.onclick = () => { window.focus(); jumpTo(m.room, m.id); n.close(); };
    } catch { /* some browsers only allow notifications from a service worker */ }
  }

  // --- live updates ------------------------------------------------------------------------
  let wsWasUp = false;
  function lastShownId() {
    const all = $("feed").querySelectorAll(".msg");
    return all.length ? Number(all[all.length - 1].dataset.id) : 0;
  }
  function appendMsg(m) {
    const feed = $("feed");
    if (feed.querySelector(`.msg[data-id="${m.id}"]`)) return;
    const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
    if (feed.querySelector(".empty")) feed.replaceChildren();
    feed.append(renderMsg(m));
    if (atBottom || m.sender === me.name) feed.scrollTop = feed.scrollHeight;
  }
  async function catchUp() {
    if (!current) return;
    const room = current;
    const msgs = await api("/api/admin/rooms/" + encodeURIComponent(room) + "/messages?after=" + lastShownId() + "&limit=500");
    if (room === current) msgs.forEach(appendMsg);
    await loadRooms();
  }
  function setLive(on, text) { $("live").classList.toggle("on", on); $("liveText").textContent = text; }
  function connect() {
    clearTimeout(wsTimer);
    const proto = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(proto + location.host + "/ws");
    ws.onopen = () => ws.send(JSON.stringify({ token }));   // empty token = use the login cookie
    ws.onmessage = (ev) => {
      const e = JSON.parse(ev.data);
      if (e.type === "ready") {
        setLive(true, "live");
        if (wsWasUp) catchUp().catch(() => {});   // fetch what was posted while we were away
        wsWasUp = true;
      }
      if (e.type !== "message") return;
      const m = e.message;
      const forMe = (m.to || []).includes(me.name) && m.sender !== me.name;
      if (m.room === current) {
        appendMsg(m);
        if (document.hidden && m.sender !== me.name) unseenHere++;
      } else {
        unread[m.room] = (unread[m.room] || 0) + 1;
        if (forMe) mentions[m.room] = (mentions[m.room] || 0) + 1;
      }
      if (forMe && (document.hidden || m.room !== current)) notify(m);
      loadRooms();
    };
    ws.onclose = () => { setLive(false, "reconnecting"); if (!$("app").hidden) wsTimer = setTimeout(connect, 3000); };
  }

  async function send(text, room) {
    await api("/api/admin/rooms/" + encodeURIComponent(room) + "/messages", { method: "POST", body: JSON.stringify({ room, text }) });
  }

  // --- @mention autocomplete -------------------------------------------------------------
  const ac = { open: false, items: [], sel: 0, start: 0 };
  function acClose() { ac.open = false; $("mentions").hidden = true; }
  function acUpdate() {
    const t = $("text"), before = t.value.slice(0, t.selectionStart);
    const m = before.match(/(?:^|[^\w@])@([a-z0-9_.-]*)$/i);
    if (!m) return acClose();
    const q = m[1].toLowerCase();
    const now = Date.now() / 1000;
    ac.items = people.filter(p => p.name !== me.name && p.name.startsWith(q))
      .sort((a, b) => (b.kind === "agent") - (a.kind === "agent") || a.name.localeCompare(b.name)).slice(0, 8);
    if (!ac.items.length) return acClose();
    ac.start = before.length - q.length - 1;
    ac.sel = Math.min(ac.sel, ac.items.length - 1);
    ac.open = true;
    $("mentions").replaceChildren(...ac.items.map((p, i) => {
      const active = p.last_seen && now - p.last_seen < 600;
      return h("div", { class: "mention-opt" + (i === ac.sel ? " sel" : ""), role: "option", "aria-selected": i === ac.sel ? "true" : "false",
          onmousedown: (e) => { e.preventDefault(); acPick(i); } },
        avatar(p.name, p.kind === "human", "sm"),
        h("div", { class: "agent-text" },
          h("div", { class: "agent-name" }, p.kind === "agent" ? h("span", { class: "dot" + (active ? " on" : "") }) : null, p.name,
            p.kind === "human" ? h("span", { class: "tag" }, "person") : h("span", { class: "tag" + (p.model ? " auto" : "") }, p.model ? "auto" : "manual")),
          p.description ? h("div", { class: "agent-desc" }, p.description) : null));
    }));
    $("mentions").hidden = false;
  }
  function acPick(i) {
    const t = $("text"), p = ac.items[i];
    const after = t.value.slice(t.selectionStart);
    const ins = "@" + p.name + " ";
    t.value = t.value.slice(0, ac.start) + ins + after.replace(/^[a-z0-9_.-]*\s?/i, "");
    const pos = ac.start + ins.length;
    t.setSelectionRange(pos, pos);
    acClose(); grow(); t.focus();
  }

  // --- forms -------------------------------------------------------------------------------
  let tokenMode = false;
  function setMode(useToken) {
    tokenMode = useToken;
    $("userFields").hidden = useToken; $("tokenField").hidden = !useToken;
    $("modeToggle").textContent = useToken ? "Sign in with a name and password" : "Use the admin token instead";
    (useToken ? $("tokenIn") : $("nameIn")).focus();
  }
  $("modeToggle").onclick = () => setMode(!tokenMode);

  $("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    $("err").hidden = true;
    try {
      if (tokenMode) {
        token = $("tokenIn").value.trim();
        await api("/api/auth/me");
        store.set("bunch.token", token);
      } else {
        await api("/api/auth/login", { method: "POST", body: JSON.stringify({ name: $("nameIn").value.trim().toLowerCase(), password: $("pwIn").value }) });
        $("pwIn").value = "";
      }
      await start();
    } catch (err) {
      $("err").textContent = err.message === "unauthorized" ? (tokenMode ? "That token didn't work." : "Wrong name or password.") : err.message;
      $("err").hidden = false;
    }
  };
  $("logout").onclick = async () => {
    try { await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" } }); } catch {}
    signOut();
  };

  $("compose").onsubmit = async (e) => {
    e.preventDefault();
    const t = $("text").value.trim();
    if (!t) return;
    if (!current) return toast("Pick or create a room first.", "bad");
    try { await send(t, current); $("text").value = ""; grow(); } catch (err) { toast(err.message, "bad"); }
  };
  const grow = () => { const t = $("text"); t.style.height = "auto"; t.style.height = t.scrollHeight + 4 + "px"; };
  $("text").addEventListener("input", () => { grow(); acUpdate(); });
  $("text").addEventListener("click", acUpdate);
  $("text").addEventListener("blur", () => setTimeout(acClose, 100));
  $("text").addEventListener("keydown", (e) => {
    if (ac.open) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        ac.sel = (ac.sel + (e.key === "ArrowDown" ? 1 : -1) + ac.items.length) % ac.items.length;
        return acUpdate();
      }
      if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); return acPick(ac.sel); }
      if (e.key === "Escape") { e.preventDefault(); return acClose(); }
    }
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("compose").requestSubmit(); }
  });

  $("newRoomForm").onsubmit = async (e) => {
    e.preventDefault();
    const name = $("newRoom").value.trim().toLowerCase().replace(/^#/, "");
    if (!name) return;
    try { await send(`${me.name} opened #${name}.`, name); $("newRoom").value = ""; await openRoom(name); toast("Room ready", "good"); }
    catch (err) { toast(err.message, "bad"); }
  };

  // New agent: typing a name reveals the details. Picking a model makes it an auto agent.
  let modelsLoaded = false;
  $("agentName").addEventListener("input", async () => {
    $("agentMore").hidden = !$("agentName").value.trim();
    if (modelsLoaded || $("agentMore").hidden) return;
    modelsLoaded = true;
    try {
      const models = await api("/api/admin/models");
      $("agentModel").append(...models.map(m => h("option", { value: m }, "Auto: hub answers with " + m)));
    } catch { /* gateway down: manual agents still work */ }
  });
  $("agentModel").onchange = () => { $("agentSystem").hidden = !$("agentModel").value; };
  $("newAgent").onsubmit = async (e) => {
    e.preventDefault();
    try {
      const r = await api("/api/admin/agents", { method: "POST", body: JSON.stringify({
        name: $("agentName").value.trim().toLowerCase(), description: $("agentDesc").value.trim(),
        model: $("agentModel").value || null, system: $("agentSystem").value.trim() || null }) });
      if ($("agentModel").value) {
        $("keyOut").replaceChildren(h("strong", null, `${r.name} is ready`), h("span", { class: "muted" }, ". @mention it in any room and the hub answers for it."));
      } else {
        $("keyOut").replaceChildren(...keyBlock(r.name, r.key));;
      }
      $("keyOut").hidden = false;
      for (const id of ["agentName", "agentDesc", "agentModel", "agentSystem"]) $(id).value = "";
      $("agentMore").hidden = true; $("agentSystem").hidden = true;
      loadAgents();
    } catch (err) { toast(err.message, "bad"); }
  };

  $("userName").addEventListener("input", () => { $("userMore").hidden = !$("userName").value.trim(); });
  $("newUser").onsubmit = async (e) => {
    e.preventDefault();
    try {
      const r = await api("/api/admin/users", { method: "POST", body: JSON.stringify({
        name: $("userName").value.trim().toLowerCase(), password: $("userPw").value, admin: $("userAdmin").checked }) });
      for (const id of ["userName", "userPw"]) $(id).value = "";
      $("userAdmin").checked = false; $("userMore").hidden = true;
      toast(`${r.name} can sign in now`, "good");
      loadUsers(); loadAgents();
    } catch (err) { toast(err.message, "bad"); }
  };

  // A login cookie or a saved admin token gets you straight in.
  start().catch(() => { $("app").hidden = true; $("login").hidden = false; });
})();
</script>
</body>
</html>
